name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to registry'
        required: false
        default: 'true'

env:
  REGISTRY: docker.io
  REGISTRY_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}

jobs:
  # Stage 1: Build & Test
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      api-version: ${{ steps.meta-api.outputs.version }}
      web-version: ${{ steps.meta-web.outputs.version }}
      tests-version: ${{ steps.meta-tests.outputs.version }}
    strategy:
      matrix:
        service: [api, web, tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Extract metadata - ${{ matrix.service }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_USERNAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image - ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: false
          load: true
          tags: ${{ matrix.service }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker

      - name: Run Hadolint - ${{ matrix.service }}
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./${{ matrix.service }}/Dockerfile
          ignore: DL3008,DL3009,DL3018,DL3045

      - name: Run Trivy scan - ${{ matrix.service }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.service }}:test
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}-results.sarif
          category: trivy-${{ matrix.service }}

      - name: Save Docker image
        run: docker save ${{ matrix.service }}:test -o /tmp/${{ matrix.service }}-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-${{ matrix.service }}
          path: /tmp/${{ matrix.service }}-image.tar
          retention-days: 1

  # Stage 2: Run Tests
  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker images - api
        uses: actions/download-artifact@v4
        with:
          name: docker-images-api
          path: /tmp/

      - name: Download Docker images - web
        uses: actions/download-artifact@v4
        with:
          name: docker-images-web
          path: /tmp/

      - name: Download Docker images - tests
        uses: actions/download-artifact@v4
        with:
          name: docker-images-tests
          path: /tmp/

      - name: Load Docker images
        run: |
          docker load -i /tmp/api-image.tar
          docker load -i /tmp/web-image.tar
          docker load -i /tmp/tests-image.tar

      - name: Start services with Docker Compose
        run: |
          docker compose -f docker-compose.staging.yml up -d
          sleep 10
          docker compose -f docker-compose.staging.yml ps

      - name: Wait for API to be healthy
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:3000/health 2>/dev/null; then
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting for API... attempt $i/30"
            sleep 2
          done
          exit 1

      - name: Run tests
        run: docker compose -f docker-compose.staging.yml run --rm tests npm test

      - name: Collect test results
        if: always()
        run: |
          docker compose -f docker-compose.staging.yml logs tests > test-logs.txt || true

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: test-logs.txt

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.staging.yml down -v

  # Stage 3: Security & Quality
  security-quality:
    name: Security & Quality Checks
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker images - api
        uses: actions/download-artifact@v4
        with:
          name: docker-images-api
          path: /tmp/

      - name: Download Docker images - web
        uses: actions/download-artifact@v4
        with:
          name: docker-images-web
          path: /tmp/

      - name: Download Docker images - tests
        uses: actions/download-artifact@v4
        with:
          name: docker-images-tests
          path: /tmp/

      - name: Download Docker images - web
        uses: actions/download-artifact@v4
        with:
          name: docker-images-web
          path: /tmp/

      - name: Download Docker images - tests
        uses: actions/download-artifact@v4
        with:
          name: docker-images-tests
          path: /tmp/

      - name: Load Docker images
        run: |
          docker load -i /tmp/api-image.tar
          docker load -i /tmp/web-image.tar
          docker load -i /tmp/tests-image.tar

      - name: Run Trivy full scan on all images
        run: |
          for image in api web tests; do
            echo "Scanning $image:test"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy image --exit-code 0 --severity HIGH,CRITICAL \
              --format table "${image}:test" || true
          done

      - name: Generate SBOM (Software Bill of Materials)
        run: |
          mkdir -p sbom-results
          for image in api web tests; do
            echo "Generating SBOM for $image:test"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v $PWD/sbom-results:/sbom-results \
              aquasec/trivy image --format cyclonedx --output "/sbom-results/sbom-${image}.json" \
              "${image}:test" || true
          done

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom-results
          path: sbom-results/
          if-no-files-found: ignore

  # Stage 4: Publish to Registry
  publish:
    name: Publish to Registry
    runs-on: ubuntu-latest
    needs: [build-and-test, run-tests, security-quality]
    if: "(github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'"
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, web, tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Extract metadata - ${{ matrix.service }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_USERNAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push - ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

  # Stage 5: Notify
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [build-and-test, run-tests, security-quality]
    if: always()
    steps:
      - name: Check workflow status
        run: |
          if [ "${{ needs.build-and-test.result }}" = "failure" ] || \
             [ "${{ needs.run-tests.result }}" = "failure" ] || \
             [ "${{ needs.security-quality.result }}" = "failure" ]; then
            echo "Pipeline failed"
            exit 1
          else
            echo "Pipeline succeeded"
          fi

      - name: Create workflow summary
        run: |
          echo "# CI/CD Pipeline Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "**Ref:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Results" >> $GITHUB_STEP_SUMMARY
          echo "- Build & Test: ${{ needs.build-and-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Run Tests: ${{ needs.run-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security & Quality: ${{ needs.security-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Publish: ${{ needs.publish.result }}" >> $GITHUB_STEP_SUMMARY